name: Build Car Launcher APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract ZIP
        run: unzip -q CarLauncher-v1.24.3.1-build-ready.zip -d .

      - name: Build APK
        working-directory: CarLauncher
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: car-launcher-apk
          path: CarLauncher/app/build/outputs/apk/debug/app-debug.apk
